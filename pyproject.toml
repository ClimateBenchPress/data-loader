[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "climatebenchpress-data-loader"
version = "1.0.0"
requires-python = ">=3.12"
authors = [
    { name = "Tim Reichelt", email = "tim.reichelt@physics.ox.ac.uk" },
    { name = "Juniper Tyree", email = "juniper.tyree@helsinki.fi" },
]
description = "Download the datasets for the ClimateBenchPress compression benchmark"
readme = "README.md"
license = "MPL-2.0"
keywords = ["climate", "compression", "benchmark", "datasets", "weather"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: System :: Archiving :: Compression",
    "Typing :: Typed",
]

dependencies = [
    "cf-xarray~=0.10.0",
    "cftime~=1.6.0",
    "dask>=2024.12.0,<2025.4",
    "earthkit-regrid~=0.5.0",
    "fsspec>=2024.10.0,<2025.4",
    "gribscan~=0.0.14",
    "healpy~=1.18.0",
    # These versions need to be pinned to be compatible with the NextGEMS
    # catalog at https://data.nextgems-h2020.eu/online.yaml.
    "intake==0.7.0",
    "intake-xarray==0.7.0",
    "requests~=2.32.3",
    # Setuptools is added to ensure compatibility with intake-xarray version 0.7.0.
    # intake-xarray is relying on distutils which was removed from Python 3.12.
    "setuptools~=75.8.2",
    "tqdm~=4.67.1",
    "typed-classproperties~=1.1.0",
    "xarray>=2024.11.0,<2025.4",
    "zarr~=2.18.0",
]

optional-dependencies.data = [
    "aiohttp~=3.11.0",
    "netcdf4~=1.7.2",
    "pandas~=2.2.0",
]

[dependency-groups]
dev = [
    "ipykernel~=6.29",
    "mypy~=1.14",
    "pandas-stubs~=2.2.0",
    "pytest~=8.3",
    "ruff~=0.15",
    "types-requests~=2.32.0.20241016",
    "types-tqdm~=4.67.0.20250301",
    "universal-pathlib~=0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/climatebenchpress"]

[tool.setuptools.package-data]
"climatebenchpress.compressor" = ["py.typed"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]

[[tool.mypy.overrides]]
module = ["fsspec.*", "intake.*", "healpy.*", "earthkit.*"]
follow_untyped_imports = true
